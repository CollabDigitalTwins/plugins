name: CLA Assistant

# Blocks a merge until every contributor has signed CLA.md by commenting on their pull request.
# Signatures are recorded in signatures/version1/cla.json on the `cla-signatures` branch.
# pull_request_target is safe here only because this workflow never checks out pull request code.
#
# ONE-TIME SETUP
#   1. Optional: a fine-grained PAT with contents:write as the PERSONAL_ACCESS_TOKEN secret, then
#      uncomment it below, so signature commits re-trigger required checks.
#   2. Require the "CLA Assistant" status check on `main` in branch protection.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        if: >
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: '${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Maintainers set the terms and are exempt; keep in sync with core's cla.yml.
          allowlist: 'dependabot[bot],github-actions[bot],collabdt,nicoarellano,ken-99,FatemehMashhadi20,gbassali'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            Thank you for contributing a plugin to Collab Digital Twins!

            Before we can merge, **all contributors must sign the [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md)**. It is the same agreement used across CDT repositories: you keep the copyright in your work, and the CLA lets us distribute it under both the AGPL-3.0 and our commercial terms. You only sign once.

            To sign, please post the following comment on this pull request:
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. Thank you!'
